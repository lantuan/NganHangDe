{# Hop xac nhan + script xoa de. Dung chung cho /gv/de-da-tao va trang chinh /gv.
   Moi <tr data-de-id=...> co nut .nut-xoa-de (data-ten=tieu de); nut #nut-xoa-tat-ca
   chi co o trang Đề đã tạo. Tach ra 13/10/2026 de trang chinh cung xoa duoc. #}
<!-- Hop xac nhan xoa giua man hinh (CLAUDE THEM 09/10/2026, co Lan duyet) -->
<div id="hop-xoa" class="hidden fixed inset-0 z-[100] items-center justify-center bg-black/40 px-margin-mobile" role="dialog" aria-modal="true" aria-labelledby="hop-xoa-tieu-de">
<div class="bg-surface-container-lowest rounded-xl shadow-xl max-w-md w-full p-stack-lg">
<h2 id="hop-xoa-tieu-de" class="font-headline-md text-headline-md font-bold text-error mb-stack-sm"></h2>
<p id="hop-xoa-noidung" class="font-body-md text-body-md text-on-surface mb-stack-md"></p>
<div id="hop-xoa-khung-go" class="hidden mb-stack-md">
<label class="block font-body-md text-body-md text-on-surface-variant mb-1">Gõ <strong>XOA</strong> để xác nhận:</label>
<input id="hop-xoa-o-go" type="text" autocomplete="off" class="w-full border border-outline-variant rounded-lg px-stack-md py-stack-sm"/>
</div>
<div class="text-right">
<button type="button" id="hop-xoa-huy" class="px-stack-lg py-stack-sm mr-stack-sm border border-outline-variant rounded-full font-label-md text-label-md">Huỷ</button>
<button type="button" id="hop-xoa-dong-y" class="px-stack-lg py-stack-sm bg-error text-on-error rounded-full font-label-md text-label-md">Xoá</button>
</div>
</div>
</div>
<script>
(function () {
  const hop = document.getElementById("hop-xoa");
  if (!hop) return;
  const tieuDe = document.getElementById("hop-xoa-tieu-de");
  const noiDung = document.getElementById("hop-xoa-noidung");
  const khungGo = document.getElementById("hop-xoa-khung-go");
  const oGo = document.getElementById("hop-xoa-o-go");
  const nutHuy = document.getElementById("hop-xoa-huy");
  const nutDongY = document.getElementById("hop-xoa-dong-y");
  let hanhDong = null;   // {ten, deIds | null (tat ca), canGo}
  let daXong = false;

  function mo(cauHinh) {
    hanhDong = cauHinh; daXong = false;
    tieuDe.textContent = cauHinh.tieuDe;
    noiDung.textContent = cauHinh.noiDung;
    oGo.value = "";
    khungGo.classList.toggle("hidden", !cauHinh.canGo);
    nutHuy.textContent = "Huỷ"; nutHuy.classList.remove("hidden");
    nutDongY.textContent = "Xoá"; nutDongY.classList.remove("hidden"); nutDongY.disabled = false;
    hop.classList.remove("hidden"); hop.classList.add("flex");
    (cauHinh.canGo ? oGo : nutHuy).focus();
  }
  function dong() {
    hop.classList.add("hidden"); hop.classList.remove("flex");
    if (daXong) location.reload();
  }
  function hienKetQua(tieu, chu) {
    daXong = true;
    tieuDe.textContent = tieu; noiDung.textContent = chu;
    khungGo.classList.add("hidden");
    nutDongY.classList.add("hidden");
    nutHuy.textContent = "Đóng";
  }
  nutHuy.addEventListener("click", dong);
  hop.addEventListener("click", function (e) { if (e.target === hop) dong(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !hop.classList.contains("hidden")) dong(); });

  nutDongY.addEventListener("click", async function () {
    if (!hanhDong) return;
    if (hanhDong.canGo) {
      const g = oGo.value.trim().toLowerCase();
      if (g !== "xoa" && g !== "xoá") { oGo.focus(); return; }
    }
    nutDongY.disabled = true; nutDongY.textContent = "Đang xoá…";
    try {
      const res = await fetch("/gv/de-da-tao/xoa", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(hanhDong.deIds ? { de_ids: hanhDong.deIds } : { tat_ca: true })
      });
      let j = null;
      try { j = await res.json(); } catch (err) { /* khong phai JSON */ }
      if (!res.ok || !j || typeof j.da_xoa !== "number") {
        hienKetQua("Không xoá được", (j && j.detail) ? String(j.detail) : "Máy chủ báo lỗi (mã " + res.status + "). Hãy đăng nhập lại rồi thử lại.");
        daXong = false;
        return;
      }
      let chu = "Đã xoá " + j.da_xoa + " đề.";
      if (j.khong_xoa_duoc) chu += " Còn " + j.khong_xoa_duoc + " đề chưa xoá được (đã có học sinh làm bài hoặc bị ràng buộc dữ liệu); các đề đó được giữ nguyên.";
      hienKetQua("Hoàn tất", chu);
    } catch (err) {
      hienKetQua("Không xoá được", "Không kết nối được máy chủ. Hãy kiểm tra mạng rồi thử lại.");
      daXong = false;
    }
  });

  document.addEventListener("click", function (e) {
    const b = e.target.closest ? e.target.closest(".nut-xoa-de") : null;
    if (b) {
      const tr = b.closest("tr");
      mo({ tieuDe: "Xoá đề này?", noiDung: "Đề «" + (b.dataset.ten || "") + "» cùng các tệp PDF, Word, .tex sẽ bị xoá và không khôi phục được. Cần giữ thì hãy tải về máy trước.",
           deIds: [tr.dataset.deId], canGo: false });
      return;
    }
    if (e.target.id === "nut-xoa-tat-ca") {
      const n = document.querySelectorAll("tr[data-de-id]").length;
      mo({ tieuDe: "Xoá TẤT CẢ đề đã tạo?", noiDung: "Toàn bộ đề của tài khoản này (trang hiện có " + n + " đề, có thể còn nhiều hơn) cùng các tệp PDF, Word, .tex sẽ bị xoá và không khôi phục được. Điểm và bài làm của học sinh không bị ảnh hưởng. Nên tải về máy những đề cần giữ trước.",
           deIds: null, canGo: true });
    }
  });
})();
</script>
