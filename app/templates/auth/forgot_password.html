<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quên mật khẩu | Ngân Hàng Đề</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: "#0050cb",
                    "primary-container": "#0066ff",
                    "on-primary": "#ffffff",
                    "on-primary-container": "#f8f7ff",
                    surface: "#f8f9ff",
                    "surface-container-low": "#eff4ff",
                    "surface-container-lowest": "#ffffff",
                    "on-surface": "#0b1c30",
                    "on-surface-variant": "#424656",
                    "outline-variant": "#c2c6d8",
                    error: "#ba1a1a"
                }
            }
        }
    }
</script>
<style>
    body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center px-4">
<div class="w-full max-w-[440px]">
<div class="mb-6 text-center">
<a href="/" class="text-xl font-bold text-primary">Ngân Hàng Đề</a>
</div>
<div class="bg-surface-container-lowest border border-outline-variant p-8 rounded-[24px] shadow-sm">
<h1 class="text-xl font-bold text-on-surface mb-2">Quên mật khẩu</h1>
<p class="text-sm text-on-surface-variant mb-6">Nhập email đã đăng ký, hệ thống sẽ gửi cho bạn một đường link để đặt lại mật khẩu.</p>

<form id="forgot-form" class="space-y-4">
<div>
<label class="block text-sm font-medium text-on-surface-variant mb-1" for="email">Email</label>
<input
    class="w-full h-12 px-4 bg-surface-container-low border-transparent rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-on-surface outline-none"
    id="email"
    name="email"
    type="email"
    placeholder="email@example.com"
    required
/>
</div>
<button
    id="submit-btn"
    class="w-full h-12 bg-primary text-on-primary font-semibold rounded-xl"
    type="submit"
>
    Gửi email đặt lại mật khẩu
</button>
</form>

<p id="status-msg" class="text-sm mt-4 hidden"></p>

<div class="mt-6 text-center">
<a class="text-primary text-sm hover:underline" href="/login">Quay lại đăng nhập</a>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
    (function () {
        var supabaseClient = window.supabase.createClient(
            "{{ supabase_url }}",
            "{{ supabase_anon_key }}"
        );
        var form = document.getElementById('forgot-form');
        var btn = document.getElementById('submit-btn');
        var statusMsg = document.getElementById('status-msg');

        function hienThongBao(text, isError) {
            statusMsg.textContent = text;
            statusMsg.classList.remove('hidden', 'text-error', 'text-primary');
            statusMsg.classList.add(isError ? 'text-error' : 'text-primary');
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            if (!email) return;

            btn.disabled = true;
            btn.textContent = 'Đang gửi...';

            var result = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/reset-password'
            });

            btn.disabled = false;
            btn.textContent = 'Gửi email đặt lại mật khẩu';

            if (result.error) {
                hienThongBao('Có lỗi xảy ra: ' + result.error.message, true);
            } else {
                hienThongBao('Đã gửi email. Vui lòng kiểm tra hộp thư (kể cả mục Spam) và bấm vào link trong email để đặt lại mật khẩu.', false);
                form.reset();
            }
        });
    })();
</script>
</body>
</html>
