<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đang đăng nhập... | Ngân Hàng Đề AI</title>
<style>
    body {
        font-family: 'Inter', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #f8f9ff;
        color: #0b1c30;
    }
    p { text-align: center; padding: 0 24px; }
    a { color: #0050cb; }
</style>
</head>
<body>
<p id="status-text">Đang xử lý đăng nhập Google...</p>
<script>
    (function () {
        var hash = window.location.hash.substring(1);
        var params = new URLSearchParams(hash);
        var access_token = params.get('access_token');
        var refresh_token = params.get('refresh_token');
        var statusEl = document.getElementById('status-text');

        function baoLoi(msg) {
            statusEl.innerHTML = msg + ' <a href="/login">Quay lại đăng nhập</a>';
        }

        if (!access_token || !refresh_token) {
            baoLoi('Đăng nhập Google thất bại hoặc bị huỷ.');
            return;
        }

        fetch('/auth/set-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({
                access_token: access_token,
                refresh_token: refresh_token,
            }),
        })
            .then(function (res) {
                if (res.ok) {
                    // Bam "Dang ky bang Google" o trang giao vien thi
                    // trang do da danh dau san cho can di toi. Chi nhan
                    // nhung duong dan TRONG DANH SACH duoi day - de
                    // khong ai sua sessionStorage thanh trang ngoai
                    // roi lua nguoi khac bam vao.
                    var CHO_PHEP = ['/toi-la-giao-vien', '/chon-vai-tro', '/chat'];
                    var di = '/chat';
                    try {
                        var luu = sessionStorage.getItem('nhd_sau_dang_nhap');
                        sessionStorage.removeItem('nhd_sau_dang_nhap');
                        if (CHO_PHEP.indexOf(luu) !== -1) { di = luu; }
                    } catch (e) { /* trinh duyet chan bo nho thi vao /chat */ }
                    window.location.href = di;
                } else {
                    baoLoi('Không xác thực được tài khoản Google.');
                }
            })
            .catch(function () {
                baoLoi('Có lỗi khi đăng nhập.');
            });
    })();
</script>
</body>
</html>
