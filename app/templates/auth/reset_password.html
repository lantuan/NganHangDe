<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đặt lại mật khẩu | Ngân Hàng Đề AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: "#0050cb",
                    "primary-container": "#0066ff",
                    "on-primary": "#ffffff",
                    "on-primary-container": "#f8f7ff",
                    surface: "#f8f9ff",
                    "surface-container-low": "#eff4ff",
                    "surface-container-lowest": "#ffffff",
                    "on-surface": "#0b1c30",
                    "on-surface-variant": "#424656",
                    "outline-variant": "#c2c6d8",
                    error: "#ba1a1a"
                }
            }
        }
    }
</script>
<style>
    body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center px-4">
<div class="w-full max-w-[440px]">
<div class="mb-6 text-center">
<a href="/" class="text-xl font-bold text-primary">Ngân Hàng Đề AI</a>
</div>
<div class="bg-surface-container-lowest border border-outline-variant p-8 rounded-[24px] shadow-sm">
<h1 class="text-xl font-bold text-on-surface mb-2">Đặt lại mật khẩu</h1>
<p id="intro-msg" class="text-sm text-on-surface-variant mb-6">Nhập mật khẩu mới cho tài khoản của bạn.</p>

<form id="reset-form" class="space-y-4">
<div>
<label class="block text-sm font-medium text-on-surface-variant mb-1" for="password">Mật khẩu mới</label>
<input
    class="w-full h-12 px-4 bg-surface-container-low border-transparent rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-on-surface outline-none"
    id="password"
    name="password"
    type="password"
    placeholder="Ít nhất 6 ký tự"
    minlength="6"
    required
/>
</div>
<div>
<label class="block text-sm font-medium text-on-surface-variant mb-1" for="password2">Nhập lại mật khẩu mới</label>
<input
    class="w-full h-12 px-4 bg-surface-container-low border-transparent rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-on-surface outline-none"
    id="password2"
    name="password2"
    type="password"
    placeholder="Ít nhất 6 ký tự"
    minlength="6"
    required
/>
</div>
<button
    id="submit-btn"
    class="w-full h-12 bg-primary text-on-primary font-semibold rounded-xl"
    type="submit"
>
    Đặt lại mật khẩu
</button>
</form>

<p id="status-msg" class="text-sm mt-4 hidden"></p>

<div class="mt-6 text-center">
<a class="text-primary text-sm hover:underline" href="/login">Quay lại đăng nhập</a>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
    (function () {
        var supabaseClient = window.supabase.createClient(
            "{{ supabase_url }}",
            "{{ supabase_anon_key }}"
        );
        var form = document.getElementById('reset-form');
        var btn = document.getElementById('submit-btn');
        var statusMsg = document.getElementById('status-msg');
        var introMsg = document.getElementById('intro-msg');

        function hienThongBao(text, isError) {
            statusMsg.textContent = text;
            statusMsg.classList.remove('hidden', 'text-error', 'text-primary');
            statusMsg.classList.add(isError ? 'text-error' : 'text-primary');
        }

        // Supabase JS tu doc token khoi phuc (recovery) trong URL fragment
        // (#access_token=...&type=recovery) va tu thiet lap phien lam viec
        // khi createClient() chay - khong can tu tay parse.
        supabaseClient.auth.onAuthStateChange(function (event) {
            if (event === 'PASSWORD_RECOVERY') {
                introMsg.textContent = 'Nhập mật khẩu mới cho tài khoản của bạn.';
            }
        });

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var password = document.getElementById('password').value;
            var password2 = document.getElementById('password2').value;

            if (password !== password2) {
                hienThongBao('Hai mật khẩu nhập vào không khớp nhau.', true);
                return;
            }
            if (password.length < 6) {
                hienThongBao('Mật khẩu cần ít nhất 6 ký tự.', true);
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Đang xử lý...';

            var result = await supabaseClient.auth.updateUser({ password: password });

            btn.disabled = false;
            btn.textContent = 'Đặt lại mật khẩu';

            if (result.error) {
                hienThongBao(
                    'Không đặt lại được mật khẩu: ' + result.error.message +
                    ' (link có thể đã hết hạn, hãy yêu cầu gửi lại email mới).',
                    true
                );
            } else {
                form.reset();
                hienThongBao('Đặt lại mật khẩu thành công! Đang chuyển tới trang đăng nhập...', false);
                setTimeout(function () {
                    window.location.href = '/login';
                }, 2000);
            }
        });
    })();
</script>
</body>
</html>
