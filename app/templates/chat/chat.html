<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngân Hàng Đề AI</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Material Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/highlight.min.js"></script>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: "global" }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>

        /* ===========================
           Reset + tokens (thay thế Tailwind)
        =========================== */

        :root {
            --color-primary: #2563eb;
            --color-secondary: #475569;
            --color-background: #f8fafc;
            --color-surface: #ffffff;
            --color-border: #e2e8f0;
            --color-slate-400: #94a3b8;
            --color-slate-500: #64748b;
            --shadow-card: 0 10px 30px rgba(15, 23, 42, .08);
            --radius-xl: 12px;
            --radius-2xl: 16px;
            --radius-3xl: 24px;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            font-family: "Inter", sans-serif;
            background: var(--color-background);
            overflow: hidden;
            color: #0f172a;
        }

        button, input, textarea { font-family: inherit; }

        /* ===========================
           Layout helpers
        =========================== */

        .app { display: flex; height: 100vh; }

        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .justify-end { justify-content: flex-end; }
        .flex-1 { flex: 1 1 0%; }
        .shrink-0 { flex-shrink: 0; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }

        .w-10 { width: 40px; }
        .h-10 { height: 40px; }
        .w-11 { width: 44px; }
        .h-11 { height: 44px; }
        .w-20 { width: 80px; }
        .h-20 { height: 80px; }
        .h-16 { height: 64px; }
        .h-12 { height: 48px; }
        .w-full { width: 100%; }
        .max-w-3xl { max-width: 48rem; }
        .max-w-4xl { max-width: 56rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }

        .p-3 { padding: 12px; }
        .p-4 { padding: 16px; }
        .p-5 { padding: 20px; }
        .p-6 { padding: 24px; }
        .px-3 { padding-left: 12px; padding-right: 12px; }
        .px-4 { padding-left: 16px; padding-right: 16px; }
        .px-5 { padding-left: 20px; padding-right: 20px; }
        .px-6 { padding-left: 24px; padding-right: 24px; }
        .px-8 { padding-left: 32px; padding-right: 32px; }
        .py-3 { padding-top: 12px; padding-bottom: 12px; }
        .py-4 { padding-top: 16px; padding-bottom: 16px; }
        .py-8 { padding-top: 32px; padding-bottom: 32px; }
        .py-16 { padding-top: 64px; padding-bottom: 64px; }
        .pb-4 { padding-bottom: 16px; }
        .mb-2 { margin-bottom: 8px; }
        .mt-3 { margin-top: 12px; }
        .mt-6 { margin-top: 24px; }

        .space-y-1 > * + * { margin-top: 4px; }
        .space-y-2 > * + * { margin-top: 8px; }

        .rounded-xl { border-radius: var(--radius-xl); }
        .rounded-2xl { border-radius: var(--radius-2xl); }
        .rounded-3xl { border-radius: var(--radius-3xl); }

        .border { border: 1px solid var(--color-border); }
        .border-t { border-top: 1px solid var(--color-border); }
        .border-b { border-bottom: 1px solid var(--color-border); }
        .border-slate-200 { border-color: #e2e8f0; }

        .bg-white { background: #ffffff; }
        .bg-primary { background: var(--color-primary); }
        .bg-background { background: var(--color-background); }

        .text-white { color: #ffffff; }
        .text-slate-400 { color: var(--color-slate-400); }
        .text-slate-500 { color: var(--color-slate-500); }

        .text-left { text-align: left; }
        .text-center { text-align: center; }

        .text-xs { font-size: 12px; }
        .text-lg { font-size: 18px; }
        .text-xl { font-size: 20px; }
        .text-3xl { font-size: 30px; }
        .text-5xl { font-size: 48px; }

        .font-semibold { font-weight: 600; }
        .font-bold { font-weight: 700; }

        .uppercase { text-transform: uppercase; }
        .tracking-widest { letter-spacing: 0.15em; }

        .whitespace-pre-wrap { white-space: pre-wrap; }

        .overflow-y-auto { overflow-y: auto; }
        .overflow-hidden { overflow: hidden; }

        .shadow-card { box-shadow: var(--shadow-card); }

        .transition { transition: all .15s ease; }

        button {
            border: none;
            cursor: pointer;
            background: none;
            color: inherit;
        }

        .hover-opacity-90:hover { opacity: .9; }
        #new-chat-btn:hover { opacity: .9; }
        .history-item:hover,
        .sidebar-link:hover,
        .icon-btn:hover { background: #f1f5f9; }
        .history-item:hover { background: #f8fafc; }

        /* ===========================
           Sidebar
        =========================== */

        .sidebar {
            width: 280px;
            border-right: 1px solid var(--color-border);
            background: #ffffff;
            display: flex;
            flex-direction: column;
            transition: transform .2s ease;
        }

        .history-item {
            display: block;
            width: 100%;
        }

        /* ===========================
           Chat
        =========================== */

        .chat-ai {
            background: white;
            border: 1px solid var(--color-border);
        }

        .chat-user {
            background: var(--color-primary);
            color: white;
        }

        #chat-area { scroll-behavior: smooth; }

        #messages {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ===========================
           Scrollbar
        =========================== */

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* ===========================
           Markdown / prose
        =========================== */

        .prose { max-width: none; line-height: 1.6; }
        .prose pre { padding: 16px; border-radius: 12px; overflow: auto; background: #0f172a0d; }
        .prose code { font-family: "JetBrains Mono", monospace; }
        .prose table { width: 100%; border-collapse: collapse; }
        .prose td, .prose th { border: 1px solid var(--color-border); padding: 8px; }
        .prose img { border-radius: 12px; max-width: 100%; }
        .prose p { margin: 0 0 .75em; }
        .prose p:last-child { margin-bottom: 0; }

        /* ===========================
           Typing indicator
        =========================== */

        .typing { display: flex; gap: 6px; align-items: center; }
        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3b82f6;
            animation: typing 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: .2s; }
        .typing span:nth-child(3) { animation-delay: .4s; }

        @keyframes typing {
            0% { opacity: .2 }
            50% { opacity: 1 }
            100% { opacity: .2 }
        }

        textarea {
            resize: none;
            outline: none;
            border: none;
            width: 100%;
        }

        /* Mobile: sidebar ẩn khi cần */
        .sidebar.hidden-mobile { transform: translateX(-100%); }

    </style>

</head>

<body>

    <div class="app">

        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside id="sidebar" class="sidebar shrink-0">

            <!-- Logo -->
            <div class="p-6 border-b">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-xl bg-primary text-white flex items-center justify-center">
                        <span class="material-symbols-outlined">auto_awesome</span>
                    </div>
                    <div>
                        <h1 class="font-bold text-xl" style="margin:0;">Ngân Hàng Đề AI</h1>
                        <p class="text-xs text-slate-500" style="margin:0;">Teacher Assistant</p>
                    </div>
                </div>
            </div>

            <!-- New Chat -->
            <div class="p-4">
                <button id="new-chat-btn"
                    class="w-full h-12 rounded-xl bg-primary text-white font-semibold transition">
                    + Chat mới
                </button>
            </div>

            <!-- History -->
            <div class="px-4 mb-2">
                <div class="text-xs uppercase tracking-widest text-slate-400">Lịch sử</div>
            </div>

            <div id="history-list" class="flex-1 overflow-y-auto px-3 pb-4 space-y-2">
                <div class="text-xs text-slate-400 px-1">Chưa có lịch sử.</div>
            </div>

            <!-- Bottom -->
            <div class="border-t p-3 space-y-1">
                <button class="sidebar-link w-full flex items-center gap-3 rounded-xl px-4 py-3">
                    <span class="material-symbols-outlined">analytics</span>
                    Đánh giá học lực
                </button>
            </div>

        </aside>

        <!-- =========================
             MAIN
        ========================== -->

        <main class="flex-1 flex flex-col bg-background">

            <!-- Header -->
            <header class="h-16 bg-white border-b flex items-center justify-between px-8">
                <div>
                    <h2 class="font-bold text-lg" style="margin:0;">Chat AI</h2>
                    <p class="text-xs text-slate-500" style="margin:0;">Tạo đề • Chấm bài • Phân tích học lực</p>
                </div>
                <div class="flex items-center gap-2">
                    <a href="/" class="icon-btn w-10 h-10 rounded-xl flex items-center justify-center" title="Ve trang chu">
                        <span class="material-symbols-outlined">home</span>
                    </a>
                </div>
            </header>

            <!-- Chat -->
            <section id="chat-area" class="flex-1 overflow-y-auto px-8 py-8">
                <div id="messages" class="max-w-4xl mx-auto">

                    <!-- Welcome -->
                    <div class="text-center py-16">
                        <div class="w-20 h-20 rounded-3xl bg-primary mx-auto flex items-center justify-center text-white">
                            <span class="material-symbols-outlined text-5xl">auto_awesome</span>
                        </div>
                        <h2 class="mt-6 text-3xl font-bold" style="margin-top:24px;">Ngân Hàng Đề AI</h2>
                        <p class="mt-3 text-slate-500">Hãy nhập yêu cầu để AI tạo đề, chấm bài hoặc phân tích học lực.</p>
                    </div>

                </div>
            </section>

            <!-- =========================
                 INPUT
            ========================== -->

            <footer class="bg-white border-t p-6">
                <div class="max-w-4xl mx-auto">

                    <form id="chat-form" class="border rounded-2xl shadow-card bg-white overflow-hidden">

                        <textarea id="message" rows="3" class="p-5"
                            placeholder="Nhập yêu cầu của bạn...&#10;&#10;Ví dụ:&#10;Tạo đề Toán 10 gồm 30 câu Chương Mệnh đề&#10;70% NB - 20% TH - 10% VD"></textarea>

                        <div class="flex items-center justify-end border-t px-4 py-3">
                            <button id="send-btn" class="bg-primary text-white px-6 h-11 rounded-xl font-semibold">
                                Gửi
                            </button>
                        </div>

                    </form>

                </div>
            </footer>

        </main>

    </div>

    <script>

        const messages = document.getElementById("messages");
        const form = document.getElementById("chat-form");
        const textarea = document.getElementById("message");

        let conversationId = crypto.randomUUID();

        function scrollBottom() {
            document.getElementById("chat-area").scrollTop =
                document.getElementById("chat-area").scrollHeight;
        }

        function addUserMessage(text) {
            messages.insertAdjacentHTML(
                "beforeend",
                `
<div class="flex justify-end">
<div class="chat-user rounded-2xl px-5 py-4 max-w-3xl whitespace-pre-wrap">
${text}
</div>
</div>
`
            );
            scrollBottom();
        }

        function addTyping() {
            messages.insertAdjacentHTML(
                "beforeend",
                `
<div id="typing" class="flex">
<div class="chat-ai rounded-2xl px-5 py-4">
<div class="typing">
<span></span>
<span></span>
<span></span>
</div>
</div>
</div>
`
            );
            scrollBottom();
        }

        function removeTyping() {
            const t = document.getElementById("typing");
            if (t) t.remove();
        }

        function addAIMessage(html) {
            messages.insertAdjacentHTML(
                "beforeend",
                `
<div class="flex">
<div class="chat-ai rounded-2xl px-5 py-4 prose max-w-3xl">
${html}
</div>
</div>
`
            );
            scrollBottom();
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        // ===== LICH SU CHAT (that, doc tu Supabase qua API) =====
        async function taiDanhSachLichSu() {
            try {
                const res = await fetch("/api/chat/history");
                const data = await res.json();
                if (!data.success) return;
                const list = document.getElementById("history-list");
                list.innerHTML = "";
                if (data.data.length === 0) {
                    list.innerHTML = '<div class="text-xs text-slate-400 px-1">Chưa có lịch sử.</div>';
                    return;
                }
                data.data.forEach(function (item) {
                    const btn = document.createElement("button");
                    btn.className = "history-item text-left rounded-xl border border-slate-200 p-3";
                    btn.textContent = item.tieu_de ? item.tieu_de.slice(0, 40) : "Hội thoại mới";
                    btn.addEventListener("click", function () {
                        moHoiThoai(item.conversation_id);
                    });
                    list.appendChild(btn);
                });
            } catch (err) {
                console.error("Loi tai lich su:", err);
            }
        }

        async function moHoiThoai(cid) {
            try {
                const res = await fetch("/api/chat/history/" + cid);
                const data = await res.json();
                if (!data.success) return;
                conversationId = cid;
                messages.innerHTML = "";
                data.data.forEach(function (msg) {
                    if (msg.role === "user") {
                        addUserMessage(msg.noi_dung || "");
                    } else if (msg.loai_phan_hoi === "file" && msg.duong_dan_file) {
                        addAIMessage(
                            `<p>${msg.noi_dung || "Đã tạo đề xong."}</p>` +
                            `<p><a href="${msg.duong_dan_file}" download target="_blank" rel="noopener">📄 Tải file</a></p>`
                        );
                    } else if (msg.loai_phan_hoi === "error") {
                        addAIMessage("Lỗi: " + (msg.noi_dung || "Có lỗi xảy ra."));
                    } else {
                        addAIMessage(marked.parse(msg.noi_dung || ""));
                    }
                });
                scrollBottom();
            } catch (err) {
                console.error("Loi mo hoi thoai:", err);
            }
        }

        // ===== GỬI TIN NHẮN LÊN /chat =====
        async function sendMessage(text) {
            addUserMessage(text);
            addTyping();

            try {
                const formData = new FormData();
                formData.append("message", text);
                formData.append("conversation_id", conversationId);

                const response = await fetch("/chat", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                removeTyping();

                if (data.need_login) {
                    window.location.href = "/login";
                    return;
                }

                if (data.success) {
                    if (data.data && data.data.type === "file") {
                        const url = data.data.url;
                        const filename = data.data.filename;
                        addAIMessage(
                            `<p>${data.message || "Đã tạo đề xong."}</p>` +
                            `<p><a href="${url}" download="${filename}" target="_blank" rel="noopener">` +
                            `📄 Tải file: ${filename}</a></p>`
                        );
                    } else if (data.reply) {
                        addAIMessage(marked.parse(data.reply));
                    } else {
                        addAIMessage(marked.parse(data.message || "Đã xử lý xong."));
                    }
                } else {
                    addAIMessage("⚠️ " + (data.message || "Có lỗi xảy ra, vui lòng thử lại."));
                }

            } catch (err) {
                removeTyping();
                addAIMessage("⚠️ Lỗi kết nối, vui lòng thử lại.");
                console.error(err);
            }
        }

        // ===== SỰ KIỆN FORM (co chan gui trung) =====
        let dangGui = false;
        form.addEventListener("submit", async function (e) {
            e.preventDefault();
            if (dangGui) return;
            const text = textarea.value.trim();
            if (!text) return;
            dangGui = true;
            document.getElementById("send-btn").disabled = true;
            textarea.value = "";
            textarea.style.height = "auto";
            try {
                await sendMessage(text);
                taiDanhSachLichSu();
            } finally {
                dangGui = false;
                document.getElementById("send-btn").disabled = false;
            }
        });

        // Enter để gửi, Shift+Enter để xuống dòng
        textarea.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                form.requestSubmit();
            }
        });

        // ===== CHAT MỚI =====
        function newChat() {
            conversationId = crypto.randomUUID();
            messages.innerHTML = `
<div class="text-center py-16">
<div class="w-20 h-20 rounded-3xl bg-primary mx-auto flex items-center justify-center text-white">
<span class="material-symbols-outlined text-5xl">
auto_awesome
</span>
</div>
<h2 class="mt-6 text-3xl font-bold" style="margin-top:24px;">
Ngân Hàng Đề AI
</h2>
<p class="mt-3 text-slate-500">
Hãy nhập yêu cầu để AI tạo đề, chấm bài hoặc phân tích học lực.
</p>
</div>
`;
            textarea.focus();
        }

        document
            .getElementById("new-chat-btn")
            .addEventListener("click", newChat);

        // Auto resize textarea
        textarea.addEventListener("input", function () {
            this.style.height = "auto";
            this.style.height = this.scrollHeight + "px";
        });

        // Focus khi mở trang
        window.onload = function () {
            textarea.focus();
            scrollBottom();
            taiDanhSachLichSu();
        };

        // ===== TOGGLE SIDEBAR (mobile) =====
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("hidden-mobile");
        }

        // Đóng sidebar trên mobile khi bấm bên ngoài
        document.addEventListener("click", function (e) {
            const sidebar = document.getElementById("sidebar");
            const menuBtn = e.target.closest("[onclick='toggleSidebar()']");
            if (
                window.innerWidth < 768 &&
                sidebar &&
                !sidebar.contains(e.target) &&
                !menuBtn
            ) {
                sidebar.classList.add("hidden-mobile");
            }
        });

        // Tự cuộn xuống cuối sau khi load
        setTimeout(scrollBottom, 100);

    </script>

</body>

</html>
